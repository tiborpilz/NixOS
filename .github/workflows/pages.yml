name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/assets/screenshots
          cp site/styles.css _site/
          cp screenshots/output/*.png _site/assets/screenshots/

          {
            cat README.md
            echo
            echo "## Screenshots"
            for f in screenshots/output/*.png; do
              name=$(basename "$f" .png)
              echo
              echo "![${name}](assets/screenshots/${name}.png)"
            done
          } > index.md

          pandoc index.md \
            --standalone \
            --metadata pagetitle="tiborpilz/NixOS" \
            --css styles.css \
            -o _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
