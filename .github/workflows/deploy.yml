name: Deploy
run-name: "Deploy ${{ inputs.node }} (${{ inputs.mode }} via ${{ inputs.transport }})"

# Manual-only: run it from the Actions tab ("Deploy" -> "Run workflow").
on:
  workflow_dispatch:
    inputs:
      node:
        description: "deploy-rs node to deploy"
        type: choice
        options:
          - klaus
        default: klaus
      mode:
        description: "switch (activate) or dry-activate (build + preview only)"
        type: choice
        options:
          - switch
          - dry-activate
        default: switch
      transport:
        description: "how the runner reaches the node"
        type: choice
        options:
          - cloudflare
          - tailscale
        default: cloudflare

# Never let two deploys of the same node overlap.
concurrency:
  group: deploy-${{ inputs.node }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-buffer-size = 524288000

      # Pull pre-built store paths so remote eval/copy stays cheap.
      - uses: cachix/cachix-action@v15
        with:
          name: tiborpilz
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # --- Cloudflare transport ------------------------------------------------
      # From nixpkgs, not a release tag (2026.6.0 regressed service-token auth).
      - name: Provision cloudflared
        if: inputs.transport == 'cloudflare'
        id: cfd
        run: |
          set -euo pipefail
          out="$(nix build --no-link --print-out-paths nixpkgs#cloudflared)"
          echo "bin=${out}/bin/cloudflared" >> "$GITHUB_OUTPUT"
          "${out}/bin/cloudflared" --version

      # --- Tailscale transport -------------------------------------------------
      # Joins the tailnet as an ephemeral node using an OAuth client. Klaus must
      # already be on the tailnet (services.tailscale on Klaus). See docs/deploy-rs.md.
      - name: Connect to Tailscale
        if: inputs.transport == 'tailscale'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # --- SSH key (both transports) ------------------------------------------
      - name: Install deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ProxyCommand tunnels SSH through Cloudflare Access (service token via
      # TUNNEL_SERVICE_TOKEN_* on the deploy step); sshd then authenticates the
      # deploy key.
      - name: Configure SSH over Cloudflare Access
        if: inputs.transport == 'cloudflare'
        run: |
          set -euo pipefail
          cat > ~/.ssh/config <<EOF
          Host ssh.tiborpilz.xyz
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand ${{ steps.cfd.outputs.bin }} access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      # Resolve Klaus's tailnet IP from the netmap (no reliance on the runner's
      # system MagicDNS) and pin it under `Host klaus`.
      - name: Configure SSH over Tailscale
        if: inputs.transport == 'tailscale'
        run: |
          set -euo pipefail
          klaus_ip="$(tailscale ip -4 klaus)"
          echo "Klaus tailnet IP: ${klaus_ip}"
          cat > ~/.ssh/config <<EOF
          Host klaus
            HostName ${klaus_ip}
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy with deploy-rs
        env:
          # Consumed by the cloudflared ProxyCommand (unused on the tailscale path).
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ inputs.mode }}" = "dry-activate" ]; then
            extra="--dry-activate"
          fi
          # The node's hostname in flake.nix is ssh.tiborpilz.xyz (the tunnel).
          # Over Tailscale we reach Klaus by its `Host klaus` ssh alias instead.
          host_override=""
          if [ "${{ inputs.transport }}" = "tailscale" ]; then
            host_override="--hostname klaus"
          fi
          nix run github:serokell/deploy-rs -- \
            --skip-checks \
            --ssh-user root \
            $host_override \
            $extra \
            ".#${{ inputs.node }}"
