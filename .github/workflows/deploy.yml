name: Deploy
run-name: "Deploy ${{ inputs.node || 'klaus' }} (${{ inputs.mode || 'switch' }})"

# Runs on every push to main, or manually from the Actions tab. Push events
# have no `inputs`, hence the `|| 'klaus'` / `|| 'switch'` fallbacks.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      node:
        description: "deploy-rs node to deploy"
        type: choice
        options:
          - klaus
        default: klaus
      mode:
        description: "switch (activate) or dry-activate (build + preview only)"
        type: choice
        options:
          - switch
          - dry-activate
        default: switch

# Never let two deploys of the same node overlap; queued pushes collapse to
# the newest one.
concurrency:
  group: deploy-${{ inputs.node || 'klaus' }}
  cancel-in-progress: false

env:
  # Klaus's address on the Netmaker mesh (repo variable, not secret).
  KLAUS_IP: ${{ vars.KLAUS_NETMAKER_IP }}
  # Must track the Netmaker server version (modules/nixos/services/netmaker.nix).
  NETCLIENT_VERSION: v0.26.0
  DEPLOY_NODE: ${{ inputs.node || 'klaus' }}
  DEPLOY_MODE: ${{ inputs.mode || 'switch' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            download-buffer-size = 524288000

      - uses: cachix/cachix-action@v15
        with:
          name: tiborpilz
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check config
        run: |
          test -n "$KLAUS_IP" || { echo "set the KLAUS_NETMAKER_IP repo variable"; exit 1; }

      # Join the mesh so this ephemeral runner can reach Klaus directly. Pinned
      # to the server version; join with an enrollment-key token.
      - name: Join Netmaker mesh
        env:
          NETMAKER_TOKEN: ${{ secrets.NETMAKER_ENROLLMENT_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -o netclient \
            "https://github.com/gravitl/netclient/releases/download/${NETCLIENT_VERSION}/netclient-linux-amd64"
          sudo install -m0755 netclient /usr/local/bin/netclient
          sudo netclient join -t "$NETMAKER_TOKEN"

      - name: Wait for Klaus over the mesh
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if timeout 3 bash -c "</dev/tcp/${KLAUS_IP}/22" 2>/dev/null; then
              echo "Klaus reachable"; exit 0
            fi
            sleep 2
          done
          echo "Klaus not reachable over the mesh" >&2
          sudo netclient list || true
          exit 1

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host klaus
            HostName ${KLAUS_IP}
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy with deploy-rs
        run: |
          set -euo pipefail
          extra=""
          if [ "$DEPLOY_MODE" = "dry-activate" ]; then
            extra="--dry-activate"
          fi
          # --skip-checks: don't run `nix flake check` (builds every host/test)
          # before deploying; deploy-rs still builds the target's own closure.
          nix run github:serokell/deploy-rs -- \
            --ssh-user root \
            --skip-checks \
            $extra \
            ".#${DEPLOY_NODE}"

      # Netmaker has no ephemeral-node auto-cleanup, so deregister explicitly.
      # A hard-killed run can still orphan a node; prune those in the dashboard.
      - name: Leave Netmaker mesh
        if: always()
        run: |
          sudo netclient leave || true
          sudo netclient uninstall || true
