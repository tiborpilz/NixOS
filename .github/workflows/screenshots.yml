  commit:
    needs: terminal
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Pushes the regenerated screenshots to the `pages` branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: terminal-screenshots
          # Stage outside the work tree so a branch switch can't clobber them.
          path: /tmp/screenshots-output

      - name: Publish screenshots to pages branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Switch to the pages branch, creating it as an orphan (screenshots
          # only, no main history) if it doesn't exist yet.
          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch origin pages
            git checkout pages
          else
            git checkout --orphan pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # Replace the screenshot set with the freshly generated ones.
          rm -rf screenshots/output
          mkdir -p screenshots/output
          cp /tmp/screenshots-output/*.png screenshots/output/

          git add -f screenshots/output/
          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(screenshots): regenerate [skip ci]"
            git push origin pages
          fi
