name: 'Screenshots'

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            download-buffer-size = 524288000
            max-jobs = auto
            cores = 0
            http-connections = 50

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: tiborpilz
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Cache Neovim Lazy plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/nvim/lazy
          key: nvim-lazy-${{ runner.os }}-${{ hashFiles('home/config/neovim/lazy-lock.json') }}
          restore-keys: |
            nvim-lazy-${{ runner.os }}-

      - name: Install Kitty + Xvfb (system Mesa for working OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y kitty xvfb

      - name: Symlink editor configs
        run: nix develop .#screenshots -c bash screenshots/scripts/setup-ci-configs.sh

      - name: Mock git repo
        run: nix develop .#screenshots -c bash screenshots/scripts/mock-git-repo.sh

      - name: Run termshot scenes
        # Command-output scenes; no Xvfb/Kitty needed, just the dev shell + mock repo.
        run: nix develop .#screenshots -c bash screenshots/scripts/run-termshot-scenes.sh

      - name: Run terminal scenes
        run: nix develop .#screenshots -c bash screenshots/scripts/run-scenes.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-screenshots
          path: screenshots/output/*.png
          if-no-files-found: error

